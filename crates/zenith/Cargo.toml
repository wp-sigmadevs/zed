[package]
name = "zenith"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/zenith.rs"
test = false
doctest = false

[features]
default = ["welcome", "search", "rails", "php", "inspections", "look", "todo"]
welcome = ["dep:zenith_welcome"]
search = ["dep:zenith_search"]
rails = ["dep:zenith_rails"]
php = ["dep:zenith_php_tools"]
inspections = ["dep:zenith_inspections"]
look = ["dep:zenith_look"]
todo = ["dep:zenith_todo"]

[dependencies]
gpui.workspace = true
onboarding.workspace = true
zenith_inspections = { workspace = true, optional = true }
zenith_look = { workspace = true, optional = true }
zenith_php_tools = { workspace = true, optional = true }
zenith_rails = { workspace = true, optional = true }
zenith_search = { workspace = true, optional = true }
zenith_todo = { workspace = true, optional = true }
zenith_welcome = { workspace = true, optional = true }
