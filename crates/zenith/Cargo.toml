[package]
name = "zenith"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/zenith.rs"
test = false
doctest = false

[features]
default = ["welcome", "search", "rails", "php", "inspections", "look", "todo", "splash", "markdown", "problems", "folds", "templates", "scratches", "local_history", "wordpress", "laravel", "external_libraries", "nextjs", "postfix", "http", "refactor", "agent_review", "navbar", "deploy", "menus"]
welcome = ["dep:zenith_welcome"]
search = ["dep:zenith_search"]
rails = ["dep:zenith_rails"]
php = ["dep:zenith_php_tools"]
inspections = ["dep:zenith_inspections"]
look = ["dep:zenith_look"]
todo = ["dep:zenith_todo"]
splash = ["dep:zenith_splash"]
markdown = ["dep:zenith_markdown"]
external_libraries = ["dep:zenith_external_libraries", "project_panel/external_libraries"]
problems = ["dep:zenith_problems"]
folds = ["dep:zenith_folds"]
templates = ["dep:zenith_templates"]
scratches = ["dep:zenith_scratches", "project_panel/scratches"]
local_history = ["dep:zenith_local_history"]
wordpress = ["dep:zenith_wordpress"]
laravel = ["dep:zenith_laravel"]
nextjs = ["dep:zenith_nextjs"]
postfix = ["dep:zenith_postfix"]
http = ["dep:zenith_http"]
refactor = ["dep:zenith_refactor"]
agent_review = ["dep:zenith_agent_review"]
navbar = ["dep:zenith_navbar"]
deploy = ["dep:zenith_deploy"]
menus = ["dep:zenith_menus"]

[dependencies]
gpui.workspace = true
onboarding.workspace = true
workspace.workspace = true
project_panel.workspace = true
zenith_agent_review = { workspace = true, optional = true }
zenith_deploy = { workspace = true, optional = true }
zenith_folds = { workspace = true, optional = true }
zenith_inspections = { workspace = true, optional = true }
zenith_laravel = { workspace = true, optional = true }
zenith_markdown = { workspace = true, optional = true }
zenith_menus = { workspace = true, optional = true }
zenith_navbar = { workspace = true, optional = true }
zenith_nextjs = { workspace = true, optional = true }
zenith_external_libraries = { workspace = true, optional = true }
zenith_local_history = { workspace = true, optional = true }
zenith_look = { workspace = true, optional = true }
zenith_php_tools = { workspace = true, optional = true }
zenith_problems = { workspace = true, optional = true }
zenith_rails = { workspace = true, optional = true }
zenith_scratches = { workspace = true, optional = true }
zenith_search = { workspace = true, optional = true }
zenith_splash = { workspace = true, optional = true }
zenith_templates = { workspace = true, optional = true }
zenith_todo = { workspace = true, optional = true }
zenith_welcome = { workspace = true, optional = true }
zenith_wordpress = { workspace = true, optional = true }
zenith_postfix = { workspace = true, optional = true }
zenith_http = { workspace = true, optional = true }
zenith_refactor = { workspace = true, optional = true }
zenith_title_bar.workspace = true
