[package]
name = "zenith"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/zenith.rs"
test = false
doctest = false

[features]
default = ["welcome", "search", "rails"]
welcome = ["dep:zenith_welcome"]
search = ["dep:zenith_search"]
rails = ["dep:zenith_rails"]

[dependencies]
gpui.workspace = true
onboarding.workspace = true
zenith_rails = { workspace = true, optional = true }
zenith_search = { workspace = true, optional = true }
zenith_welcome = { workspace = true, optional = true }
